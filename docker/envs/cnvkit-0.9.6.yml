# CNVkit 0.9.6 (Python 3.7). Dependencies pinned to releases contemporary with CNVkit 0.9.6 (2019); newer
# releases break it (e.g. biopython >= 1.77 removed Bio._py3k, pandas 1.0 removed APIs it uses).
# The fully solved environment is exported to /opt/applet/cnvkit.lock in the image.
name: cnvkit
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.7
  - cnvkit=0.9.6
  - biopython=1.76
  - numpy=1.17.5
  - scipy=1.3.3
  - pandas=0.25.3
  - matplotlib=3.1.3
  - pomegranate=0.11.1
  - pyfaidx=0.5.8
  - bioconductor-dnacopy
  - samtools=1.9
